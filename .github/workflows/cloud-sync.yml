name: Cloud migration tools
on:
  pull_request:
    paths:
      - scripts/cloud_sync*.py
      - deploy/migration/**
      - .github/workflows/cloud-sync.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p 'cloud_sync*test.py'
